services:
  db:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_USER: florex
      POSTGRES_PASSWORD: florex
      POSTGRES_DB: florex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U florex -d florex"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  stem:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://florex:florex@db:5432/florex
      PORT: "3000"
      CORS_ORIGIN: http://localhost:5173
      KEMAL_ENV: development
    ports:
      - "3000:3000"

volumes:
  pgdata:
